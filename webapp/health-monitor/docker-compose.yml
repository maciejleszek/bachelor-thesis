version: "3.9"

services:

  db:
    image: postgres:16-alpine
    container_name: health_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: health
      POSTGRES_USER: health
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U health" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: health_api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://health:${DB_PASSWORD:-changeme}@db:5432/health
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: health_frontend
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: health_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend

  sync:
    build: ./sync
    container_name: health_sync
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://health:${DB_PASSWORD:-changeme}@db:5432/health
      GARMIN_EMAIL: ${GARMIN_EMAIL}
      GARMIN_PASSWORD: ${GARMIN_PASSWORD}
      GARMIN_TOKEN_DIR: /data/garmin_tokens
      MIBAND_MODE: file
      MIBAND_IMPORT_DIR: /data/miband_imports
      XIAOMI_EMAIL: ${XIAOMI_EMAIL:-}
      XIAOMI_PASSWORD: ${XIAOMI_PASSWORD:-}
      XIAOMI_REGION: ${XIAOMI_REGION:-us}
    volumes:
      - sync_data:/data
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  sync_data:

